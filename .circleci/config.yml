version: 2.1

jobs:
  loader_hotfix-8520:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Pivot result stream
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; seq 1 984648 | sha256sum > /tmp/handoff/checkpoint-B.pickle; true
            len=$(wc -c </tmp/handoff/checkpoint-B.pickle); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - checkpoint-B.pickle
  hotfix-8520:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Inherit stage
          command: |
            { cat /tmp/handoff/secondary_step_output.txt > /dev/null; echo "read ok" ; } || true
      - run:
          name: Pull repo contents
          command: git clone --depth 3 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull static data
          command: tar -xz -f bundle.tgz
      - run:
          no_output_timeout: 69m
          command: "$PWD/script"
